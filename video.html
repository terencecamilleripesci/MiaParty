<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia's 1st Birthday 🎀 — the video</title>
<meta name="description" content="Mia's first year, from day one to her 1st birthday 💕">
<meta name="theme-color" content="#F9A8D4">
<meta property="og:title" content="Mia's 1st Birthday 🎀 — watch her first year">
<meta property="og:description" content="From day one to her first birthday — Mia's story in 18 minutes 💕">
<meta property="og:image" content="https://terencecamilleripesci.github.io/MiaParty/assets/share.jpg">
<meta property="og:url" content="https://terencecamilleripesci.github.io/MiaParty/video.html">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Baloo 2',system-ui,sans-serif;background:#FBCFE8;color:#7A1B4C;min-height:100dvh;
  background-image:linear-gradient(180deg,rgba(255,245,249,.5),rgba(251,207,232,.85))}
.wrap{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));text-align:center}
h1{color:#BE185D;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.15}
h1 small{display:block;font-size:.5em;color:#B94A85;font-weight:700;margin-top:4px}
.player{margin:18px 0 14px;border-radius:22px;overflow:hidden;background:#000;
  box-shadow:0 18px 45px rgba(190,24,93,.35);border:4px solid #fff}
video{width:100%;display:block;max-height:72dvh;background:#000}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:330px;
  padding:15px 22px;border-radius:999px;border:none;cursor:pointer;text-decoration:none;
  font:800 1rem 'Baloo 2';background:linear-gradient(135deg,#EC4899,#BE185D);color:#fff;
  box-shadow:0 8px 22px rgba(190,24,93,.35)}
.btn.alt{background:#fff;color:#BE185D;border:2.5px solid #F9A8D4;box-shadow:0 4px 14px rgba(190,24,93,.15)}
.btn:active{transform:scale(.97)}
.note{font-size:.82rem;color:#A8548A;font-weight:700;margin-top:14px;line-height:1.5}
.copied{font-size:.85rem;color:#BE185D;font-weight:800;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mia's First Year 🎀<small>from day one to her 1st birthday 💕</small></h1>

  <div class="player">
    <video id="v" controls playsinline preload="metadata"
           poster="video/poster.jpg">
      <source src="video/mia-birthday.mp4" type="video/mp4">
      Your browser can't play this video — tap Download below.
    </video>
  </div>

  <div class="btns">
    <a class="btn" id="dl" href="video/mia-birthday.mp4" download="Mia-1st-Birthday.mp4">
      ⬇️ Download the video
    </a>
    <button class="btn alt" onclick="share()">🔗 Share this video</button>
    <a class="btn alt" href="./">📸 Back to Mia's camera</a>
  </div>
  <div class="copied" id="msg"></div>

  <p class="note">18 minutes · works on any phone, tablet or computer<br>
     Tap ⬇️ to keep it forever 💕</p>
</div>

<script>
const LINK = 'https://terencecamilleripesci.github.io/MiaParty/video.html';
async function share(){
  const data = { title: "Mia's 1st Birthday 🎀", text: "Watch Mia's first year 💕", url: LINK };
  try{
    if (navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(LINK);
    document.getElementById('msg').textContent = '✅ Link copied — paste it anywhere!';
  }catch(e){
    document.getElementById('msg').textContent = LINK;
  }
  setTimeout(()=>document.getElementById('msg').textContent='', 6000);
}
/* if the Pi is briefly unreachable, say so kindly instead of showing a dead player */
document.getElementById('v').addEventListener('error', () => {
  document.getElementById('msg').textContent = '📶 Video is loading slowly — try again in a moment.';
});
</script>
</body>
</html>
