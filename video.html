<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia's 1st Birthday 🎀 — the video</title>
<meta name="description" content="Mia's first year, from day one to her 1st birthday 💕">
<meta name="theme-color" content="#F9A8D4">
<meta http-equiv="Cache-Control" content="no-store">
<meta property="og:title" content="Mia's 1st Birthday 🎀 — watch her first year">
<meta property="og:description" content="From day one to her first birthday — Mia's story in 18 minutes 💕">
<meta property="og:image" content="https://terencecamilleripesci.github.io/MiaParty/assets/share.jpg">
<meta property="og:url" content="https://terencecamilleripesci.github.io/MiaParty/video.html">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Baloo 2',system-ui,sans-serif;background:#FBCFE8;color:#7A1B4C;min-height:100dvh;
  background-image:linear-gradient(180deg,rgba(255,245,249,.5),rgba(251,207,232,.85))}
.wrap{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));text-align:center}
h1{color:#BE185D;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.15}
h1 small{display:block;font-size:.5em;color:#B94A85;font-weight:700;margin-top:4px}
.player{margin:18px 0 14px;border-radius:22px;overflow:hidden;background:#000;
  box-shadow:0 18px 45px rgba(190,24,93,.35);border:4px solid #fff}
video{width:100%;display:block;max-height:72dvh;background:#000}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:330px;
  padding:15px 22px;border-radius:999px;border:none;cursor:pointer;text-decoration:none;
  font:800 1rem 'Baloo 2';background:linear-gradient(135deg,#EC4899,#BE185D);color:#fff;
  box-shadow:0 8px 22px rgba(190,24,93,.35)}
.btn.alt{background:#fff;color:#BE185D;border:2.5px solid #F9A8D4;box-shadow:0 4px 14px rgba(190,24,93,.15)}
.btn:active{transform:scale(.97)}
.note{font-size:.82rem;color:#A8548A;font-weight:700;margin-top:14px;line-height:1.5}
.copied{font-size:.85rem;color:#BE185D;font-weight:800;min-height:1.2em;margin-top:8px}
.bar{display:none;max-width:330px;margin:6px auto 0;height:8px;background:#fff;border-radius:999px;
  overflow:hidden;border:2px solid #F9A8D4}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#EC4899,#BE185D);transition:width .2s}
.btn:disabled{opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mia's First Year 🎀<small>from day one to her 1st birthday 💕</small></h1>

  <div class="player">
    <video id="v" controls playsinline preload="metadata"
           poster="video/poster.jpg">
      <source src="video/mia-birthday.mp4" type="video/mp4">
      Your browser can't play this video — tap Download below.
    </video>
  </div>

  <div class="btns">
    <button class="btn" id="dl" onclick="saveVideo()">⬇️ Save the video</button>
    <button class="btn alt" onclick="share()">🔗 Share this video</button>
    <a class="btn alt" href="./">📸 Back to Mia's camera</a>
  </div>
  <div class="copied" id="msg"></div>
  <div class="bar" id="bar"><i></i></div>

  <p class="note" id="tip">18 minutes · works on any phone, tablet or computer<br>
     Tap ⬇️ to keep it forever 💕</p>
</div>

<script>
const FILE = 'video/mia-birthday.mp4';
const NAME = 'Mia-1st-Birthday.mp4';
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const msg = t => document.getElementById('msg').textContent = t;

/* Saving a video reliably on BOTH phones:
   - iOS Safari IGNORES the download attribute (it just plays the file), so the only real
     way to keep it is the native share sheet -> "Save Video" / "Save to Files".
   - Android Chrome handles download fine, but in-app browsers often swallow it.
   So: fetch the file, then offer it through the OS share sheet when that's supported,
   and fall back to a normal blob download everywhere else. */
let readyFile = null;      // the downloaded video, waiting for a FRESH tap

/* TWO STEPS on purpose. iOS only opens the save sheet during a real user tap, and by the
   time 41 MB has downloaded that tap has "expired" (NotAllowedError). So: first tap
   downloads and the button turns into "Ready — tap to save"; the second tap shares
   instantly, inside a valid gesture. */
async function saveVideo(){
  const btn = document.getElementById('dl');
  const bar = document.getElementById('bar');

  // ---- second tap: hand it to the phone straight away ----
  if (readyFile){
    try{
      if (navigator.canShare && navigator.canShare({ files: [readyFile] })){
        await navigator.share({ files: [readyFile], title: "Mia's 1st Birthday 🎀" });
        msg('✅ Saved!');
      } else {
        const url = URL.createObjectURL(readyFile);
        const a = document.createElement('a');
        a.href = url; a.download = NAME;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        msg('✅ Saved to your files!');
      }
    }catch(e){
      if (e && e.name === 'AbortError') msg('');
      else msg('Press and hold the video above → “Save to Photos”.');
    }
    return;
  }

  // ---- first tap: fetch it ----
  btn.disabled = true;
  try{
    msg('Getting the video ready…');
    bar.style.display = 'block';
    const res = await fetch(FILE);
    if (!res.ok) throw new Error('fetch ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    let blob;
    if (reader){
      const chunks = []; let got = 0;
      for(;;){
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        if (total){
          const pct = Math.round(got / total * 100);
          bar.firstElementChild.style.width = pct + '%';
          btn.textContent = '⬇️ ' + pct + '%';
        }
      }
      blob = new Blob(chunks, { type: 'video/mp4' });
    } else {
      blob = await res.blob();
    }
    readyFile = new File([blob], NAME, { type: 'video/mp4' });
    bar.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '✅ Ready — tap to save';
    msg(isIOS ? 'Now tap again, then choose “Save Video” 💕'
              : 'Now tap again to keep it 💕');
  }catch(e){
    bar.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '⬇️ Save the video';
    msg('Press and hold the video above → “Save to Photos”.');
  }
}
/* helpful per-phone hint under the buttons */
addEventListener('DOMContentLoaded', () => {
  const t = document.getElementById('tip');
  if (t) t.innerHTML = isIOS
    ? '18 minutes 💕<br>Tap ⬇️ then choose <b>Save Video</b> — or press and hold the video above.'
    : '18 minutes 💕<br>Tap ⬇️ to keep it on your phone forever.';
});

const LINK = 'https://terencecamilleripesci.github.io/MiaParty/video.html';
async function share(){
  const data = { title: "Mia's 1st Birthday 🎀", text: "Watch Mia's first year 💕", url: LINK };
  try{
    if (navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(LINK);
    document.getElementById('msg').textContent = '✅ Link copied — paste it anywhere!';
  }catch(e){
    document.getElementById('msg').textContent = LINK;
  }
  setTimeout(()=>document.getElementById('msg').textContent='', 6000);
}
/* if the Pi is briefly unreachable, say so kindly instead of showing a dead player */
document.getElementById('v').addEventListener('error', () => {
  document.getElementById('msg').textContent = '📶 Video is loading slowly — try again in a moment.';
});
</script>
</body>
</html>
